services:
  os-init:
    image: curlimages/curl:8.4.0
    container_name: os-init
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ./services/alerting/alerts-template.json:/init/alerts-template.json:ro
      - ./services/alerting/incidents-template.json:/init/incidents-template.json:ro
    command: >
      sh -lc '
        OS="${OPENSEARCH_URL:-http://opensearch:9200}";
        echo "waiting for $$OS...";
        until curl -fsS "$$OS/_cluster/health" >/dev/null; do sleep 2; done;
        echo "applying index template...";
        curl -fsS -X PUT "$$OS/_index_template/alerts-template" -H "Content-Type: application/json" --data "@/init/alerts-template.json";
        curl -fsS -X PUT "$$OS/_index_template/incidents-template" -H "Content-Type: application/json" --data "@/init/incidents-template.json";
        echo "done";'
    restart: "no"
  retrain:
    build:
      context: .
      dockerfile: services/retrain/Dockerfile
    container_name: retrain
    command:
      - sh
      - -lc
      - |
        set -e
        ML_TRAIN_PATH="/data/ml_train.csv"
        ML_VALIDATION_PATH="/data/ml_validation.csv"
        ML_TEST_PATH="/data/ml_test.csv"
        ML_SUPERVISED_TRAIN_PATH="/data/ml_supervised_train.csv"
        OCSVM_EXTRA_PATH="/data/ml_ocsvm_train_extra.csv"
        NLP_TRAIN_PATH="/data/nlp_train.csv"
        REBUILT_SPLITS=0

        if [ ! -f "$$ML_VALIDATION_PATH" ] || [ ! -f "$$ML_TEST_PATH" ] || [ ! -f "$$OCSVM_EXTRA_PATH" ] || [ ! -f "$$ML_SUPERVISED_TRAIN_PATH" ]; then
          echo "[retrain CMD] required files missing (val=$$ML_VALIDATION_PATH test=$$ML_TEST_PATH extra=$$OCSVM_EXTRA_PATH sup=$$ML_SUPERVISED_TRAIN_PATH)"
          echo "[retrain CMD] building CSIC splits for calibration/test + supervised_train..."
          ML_VALIDATION_FILE="$$ML_VALIDATION_PATH" ML_TEST_FILE="$$ML_TEST_PATH" ML_SUPERVISED_TRAIN_FILE="$$ML_SUPERVISED_TRAIN_PATH" python -u jobs/retrain/build_ml_numeric_from_csic.py --override

          echo "[retrain CMD] appending AttackLab attack-only slices to calibration/test..."
          ML_NUM_FILE="$$ML_TRAIN_PATH" ML_VALIDATION_FILE="$$ML_VALIDATION_PATH" ML_TEST_FILE="$$ML_TEST_PATH" python -u jobs/retrain/build_ml_numeric_attacklab.py --attacklab-only
          REBUILT_SPLITS=1
        else
          echo "[retrain CMD] ml_validation/ml_test/ml_supervised_train already exist, skipping build scripts"
        fi

        if [ ! -f "$$ML_TRAIN_PATH" ] || [ "$$REBUILT_SPLITS" = "1" ]; then
          echo "[retrain CMD] preparing ml_train (path=$$ML_TRAIN_PATH)"
          if [ "$$REBUILT_SPLITS" = "1" ] && [ -f "$$ML_TRAIN_PATH" ]; then
            echo "[retrain CMD] val/test were rebuilt; rebuilding ml_train to keep pattern-disjointness..."
          fi
          echo "[retrain CMD] building ml_train benign mix (mahendra + csic benign), disjoint from val/test..."
          ML_NUM_FILE="$$ML_TRAIN_PATH" python -u jobs/retrain/build_ml_numeric_attacklab.py --train-only --override-train
        else
          echo "[retrain CMD] ml_train already exists at $$ML_TRAIN_PATH, skipping train build"
        fi

        echo "[retrain CMD] cleaning generated retrain artifacts in /models/ml (preserve ml_config.json)..."
        mkdir -p /models/ml
        find /models/ml -mindepth 1 -maxdepth 1 -type f ! -name "ml_config.json" -delete

        if [ ! -f "$$NLP_TRAIN_PATH" ]; then
          echo "[retrain CMD] nlp_train not found at $$NLP_TRAIN_PATH, building from Kaggle..."
          echo "[retrain CMD] building nlp_train from httpparams dataset..."
          cp /data/nlp_base.csv /data/nlp_train.csv
          python -u jobs/retrain/build_nlp_from_httpparams.py --mode append
          echo "[retrain CMD] building nlp_train from web application payload dataset..."
          python jobs/retrain/build_nlp_from_web_payloads.py --mode append
        else
          echo "[retrain CMD] nlp_train already exists at $$NLP_TRAIN_PATH, skipping build scripts"
        fi

        echo "[retrain CMD] running main retrain..."
        python -u jobs/retrain/main.py
    restart: "no"
    environment:
      DATA: /data/nlp_train.csv
      IF_OUT: "/models/ml/if_model.joblib"
      NLP_TFIDF_LR_PATH: /models/nlp/nlp_tfidf_lr.joblib
      NLP_CHAR_SGD_PATH: /models/nlp/nlp_char_sgd.joblib
      NLP_TRAIN_FILE: "/data/nlp_train.csv"
      ML_NUM_FILE: "/data/ml_train.csv"
      ML_TRAIN_FILE: "/data/ml_train.csv"
      ML_VALIDATION_FILE: "/data/ml_validation.csv"
      ML_TEST_FILE: "/data/ml_test.csv"
      ML_SUPERVISED_TRAIN_FILE: "/data/ml_supervised_train.csv"
      RETRAIN_ENABLE_TEST_EVAL: "true"
      ML_AUTO_SPLIT_VAL_FOR_TEST: "false"
      ML_VAL_TEST_SPLIT: "0.2"
      ML_EVAL_SHUFFLE: "true"
      ML_SPLIT_GROUP_BY_FEATURES: "true"
      ML_SPLIT_GROUP_INCLUDE_LABEL: "false"
      ML_SOURCE_HOLDOUT_ENABLED: "false"
      ML_SOURCE_HOLDOUT_STRICT: "false"
      ML_SOURCE_HOLDOUT_COLUMN: "source"
      ML_SOURCE_HOLDOUT_SOURCE: "csic"
      ML_SOURCE_HOLDOUT_MIN_ROWS: "1000"
      ML_NUM_MAX_ATTACK_FRAC: "0.001"
      ML_VAL_MAX_ROWS: "300000"
      ML_TEST_MAX_ROWS: "200000"
      ML_THRESHOLD_POLICY: "fpr_budget"
      ML_TARGET_FPR: "0.05"
      ML_PRIMARY_CORE_KINDS: "sup_hgb,sup_rf,sup_et"
      ML_AUX_NOVELTY_KINDS: "if,ocsvm,ae,lstm_ae"
      ML_PRIMARY_ENSEMBLE_AGG: "mean_logit"
      ML_AUX_NOVELTY_AGG: "mean_logit"
      ML_BOOTSTRAP_CI_ENABLED: "true"
      ML_BOOTSTRAP_CI_SAMPLES: "500"
      ML_BOOTSTRAP_CI_ALPHA: "0.05"
      ML_BOOTSTRAP_CI_MAX_ROWS: "50000"
      ML_BOOTSTRAP_CI_RANDOM_STATE: "42"
      # Optional deployment attack prior for probability correction.
      # Set to -1 to disable, or to (0,1) for odds correction (e.g., 0.05).
      ML_DEPLOY_ATTACK_PRIOR: "0.05"
      # Main ID protocol: train anomaly models on the same benign domain (CSIC)
      # used for calibration/test to avoid domain-shift artifacts.
      MAHENDRA_TRAIN_ROWS: "30000"
      CSIC_VAL_BENIGN_ROWS: "4000"
      CSIC_VAL_BENIGN_OFFSET: "0"
      # CSIC is the primary attack source for calibration/test (target ~80/20 benign/attack).
      CSIC_VAL_ATTACK_ROWS: "1000"
      CSIC_VAL_ATTACK_OFFSET: "0"
      CSIC_TEST_BENIGN_ROWS: "8000"
      CSIC_TEST_BENIGN_OFFSET: "4000"
      CSIC_TEST_ATTACK_ROWS: "2000"
      CSIC_TEST_ATTACK_OFFSET: "1000"
      CSIC_OCSVM_BENIGN_ROWS: "8000"
      CSIC_OCSVM_BENIGN_OFFSET: "0"
      CSIC_TRAIN_BENIGN_ROWS: "36000"
      CSIC_TRAIN_BENIGN_OFFSET: "0"
      OCSVM_EXTRA_BENIGN_FILE: "/data/ml_ocsvm_train_extra.csv"
      OCSVM_EXTRA_BENIGN_MAX_ROWS: "8000"
      # AttackLab is used as OOD test-only source (not for calibration).
      ATTACKLAB_VAL_ATTACK_ROWS: "0"
      ATTACKLAB_VAL_ATTACK_OFFSET: "0"
      # Single-domain default: keep AttackLab disabled in main test.
      # Enable it only for separate OOD robustness runs.
      ATTACKLAB_TEST_ATTACK_ROWS: "0"
      ATTACKLAB_TEST_ATTACK_OFFSET: "20000"
      ATTACKLAB_HTTP_ONLY: "true"
      ATTACKLAB_STRATIFIED_SELECTION: "true"
      ATTACKLAB_MAX_DUP_PER_PATTERN_SPLIT: "1"
      ATTACKLAB_RELAX_DUP_CAP_FILL: "false"
      ATTACKLAB_UNIQUE_PATTERNS_ONLY: "true"
      ATTACKLAB_POOL_MULTIPLIER: "80"
      ATTACKLAB_POOL_MIN_ROWS: "50000"
      ML_ENFORCE_VAL_TEST_DISJOINT: "true"
      CSIC_SUPERVISED_EXCLUDE_VAL_TEST: "true"
      CSIC_SUPERVISED_EXCLUDE_MODE: "pattern"
      CSIC_SUPERVISED_REQUIRE_BOTH_CLASSES: "true"
      ML_DUP_GROUP_ROUND_DECIMALS: "6"
      ML_DATASET_SHUFFLE_SEED: "42"
      OCSVM_SCALER: "standard"
      OCSVM_NU: "0.15"
      OCSVM_GAMMA: "scale"
      OCSVM_ROBUST_Q_LOW: "5"
      OCSVM_ROBUST_Q_HIGH: "95"
      IF_TUNE_ENABLED: "true"
      IF_N_ESTIMATORS_GRID: "200,400,800"
      IF_MAX_SAMPLES_GRID: "0.8,1.0"
      IF_MAX_FEATURES_GRID: "0.6,1.0"
      IF_BOOTSTRAP_GRID: "false"
      # Keep benign train diverse for anomaly models (AE/LSTM/IF/OCSVM):
      # too many identical templates collapse score granularity.
      ML_NUM_MAX_DUP_PER_PATTERN_BENIGN: "5"
      ML_NUM_MAX_DUP_PER_PATTERN_ATTACK: "0"
      TRAIN_ENFORCE_DISJOINT_WITH_VAL_TEST: "true"
      TRAIN_DISJOINT_MODE: "row"
      TRAIN_SOURCE_BALANCE_ENABLED: "true"
      TRAIN_SOURCE_MAX_RATIO: "2.0"
      # For scientific evaluation keep calibration/test as-is (no deduplication).
      ML_VAL_MAX_DUP_PER_PATTERN_BENIGN: "0"
      ML_VAL_MAX_DUP_PER_PATTERN_ATTACK: "0"
      ANOM_PROB_EPS: "1e-12"
      ANOM_LOGIT_C: "1.0"
      ANOM_LOGIT_C_GRID: "0.1,0.5,1,2,5,10,20,50"
      ANOM_LOGIT_CV_HOLDOUT: "0.2"
      TRAIN_TARGET: "all"
      LOG_LEVEL: "INFO"
      FEATURE_ORDER: "endpoint_len,header_count,payload_size,headers_entropy,query_param_count,path_depth,suspicious_char_ratio,is_json_payload,http_method_code,query_len,query_entropy,query_value_len_mean,query_value_len_max,empty_query_value_ratio,path_entropy,path_digit_ratio,path_upper_ratio,body_len,body_entropy,body_digit_ratio,body_punct_ratio,pct_encoded_ratio,header_value_total_len,header_value_max_len"
    volumes:
      - ./data:/data
      - ./models:/models
    # retrain — batch, без портів/хелсчеків
  preprocess:
    build: 
      context: .
      dockerfile: services/preprocess/Dockerfile
    container_name: preprocess
    restart: unless-stopped
    environment:
      LOG_LEVEL: "INFO"
      MAX_EVENT_BYTES: "2000000"
      MAX_TEXT_BYTES: "20000"
      ORCH_TOKEN: "yx4hMeToZ5AEsMywCZJYxxr5"
      PREPROC_ENV: "prod"
    command:
      - gunicorn
      - main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "${GUNICORN_WORKERS:-2}"
      - -b
      - 0.0.0.0:8000
      - --timeout
      - "30"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --access-logformat
      - '{"ts":"%(t)s","level":"INFO","client":"%(h)s","req":"%(r)s","status":%(s)s,"bytes":%(B)s,"referer":"%({Referer}i)s","ua":"%({User-Agent}i)s"}'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 15s
    volumes:
      - ./rules:/app/rules:ro
  ml-inference:
    build:
      context: .
      dockerfile: services/ml_infer/Dockerfile
    restart: unless-stopped
    command:
      - gunicorn
      - main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "${ML_GUNICORN_WORKERS:-1}"
      - -b
      - 0.0.0.0:8000
      - --timeout
      - "30"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --access-logformat
      - '{"ts":"%(t)s","level":"INFO","client":"%(h)s","req":"%(r)s","status":%(s)s,"bytes":%(B)s,"referer":"%({Referer}i)s","ua":"%({User-Agent}i)s"}'
    environment:
      LOG_LEVEL: "INFO"
      PRELOAD_MODELS: "true"
      ANOM_PROB_EPS: "1e-12"
      FEATURE_ORDER: "endpoint_len,header_count,payload_size,headers_entropy,query_param_count,path_depth,suspicious_char_ratio,is_json_payload,http_method_code,query_len,query_entropy,query_value_len_mean,query_value_len_max,empty_query_value_ratio,path_entropy,path_digit_ratio,path_upper_ratio,body_len,body_entropy,body_digit_ratio,body_punct_ratio,pct_encoded_ratio,header_value_total_len,header_value_max_len"
      MODEL_PATH_IF: "/models/ml/if_model.joblib"
      MODEL_PATH_OCSVM: "/models/ml/ocsvm_model.joblib"
      MODEL_PATH_AE: "/models/ml/ae_model.joblib"
      MODEL_PATH_LSTM_AE: "/models/ml/lstm_ae_model.joblib"
      ML_PRIMARY_CORE_KINDS: "sup_hgb,sup_rf,sup_et"
      ML_AUX_NOVELTY_KINDS: "if,ocsvm,ae,lstm_ae"
      ML_PRIMARY_ENSEMBLE_AGG: "mean_logit"
      ML_AUX_NOVELTY_AGG: "mean_logit"
    volumes:
      - ./models:/models:ro
      - ./policies/impact_policy.json:/app/policies/impact_policy.json:ro
    # depends_on:
    #   retrain:
    #     condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys,json; r=urllib.request.urlopen('http://localhost:8000/ready'); sys.exit(0 if r.status==200 else 1)\""]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 15s
  nlp-inference:
    build:
      context: .
      dockerfile: services/nlp_infer/Dockerfile
    restart: unless-stopped
    command:
      - gunicorn
      - main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "${NLP_GUNICORN_WORKERS:-1}"
      - -b
      - 0.0.0.0:8000
      - --timeout
      - "30"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --access-logformat
      - '{"ts":"%(t)s","level":"INFO","client":"%(h)s","req":"%(r)s","status":%(s)s,"bytes":%(B)s,"referer":"%({Referer}i)s","ua":"%({User-Agent}i)s"}'
    environment:
      LOG_LEVEL: "INFO"
      NLP_THRESHOLD: "0.60"
      NLP_LOAD_PER_ATTACK_MODELS: "true"
      NLP_TFIDF_LR_PATH: "/models/nlp/nlp_tfidf_lr.joblib"
      NLP_CHAR_SGD_PATH: "/models/nlp/nlp_char_sgd.joblib"
    volumes:
      - ./models:/models:ro
      - ./rules:/app/rules:ro 
    # depends_on:
    #   retrain:
    #     condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)\""]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 15s
  compose-autoscaler:
    image: docker:27-cli
    restart: unless-stopped
    working_dir: "${HOST_PROJECT_DIR:-/Users/azizabibulaev/Desktop/Projects/ml-nlp-risk-pipeline}"
    command:
      - sh
      - "${HOST_PROJECT_DIR:-/Users/azizabibulaev/Desktop/Projects/ml-nlp-risk-pipeline}/scripts/compose-autoscale.sh"
    environment:
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-ml-nlp-risk-pipeline}"
      PROJECT_DIR: "${HOST_PROJECT_DIR:-/Users/azizabibulaev/Desktop/Projects/ml-nlp-risk-pipeline}"
      COMPOSE_FILE_PATH: "${HOST_PROJECT_DIR:-/Users/azizabibulaev/Desktop/Projects/ml-nlp-risk-pipeline}/docker-compose.yaml"
      AUTOSCALE_INTERVAL_SEC: "30"
      AUTOSCALE_CPU_UP_PCT: "75"
      AUTOSCALE_CPU_DOWN_PCT: "25"
      AUTOSCALE_COOLDOWN_CYCLES: "2"
      ML_MIN_REPLICAS: "1"
      ML_MAX_REPLICAS: "3"
      NLP_MIN_REPLICAS: "1"
      NLP_MAX_REPLICAS: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${HOST_PROJECT_DIR:-/Users/azizabibulaev/Desktop/Projects/ml-nlp-risk-pipeline}:${HOST_PROJECT_DIR:-/Users/azizabibulaev/Desktop/Projects/ml-nlp-risk-pipeline}:ro"
    depends_on:
      ml-inference:
        condition: service_started
      nlp-inference:
        condition: service_started
  fusion:
    build:
      context: .
      dockerfile: services/fusion/Dockerfile
    container_name: fusion
    restart: unless-stopped
    command:
      - gunicorn
      - main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "${GUNICORN_WORKERS:-2}"
      - -b
      - 0.0.0.0:8000
      - --timeout
      - "30"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --access-logformat
      - '{"ts":"%(t)s","level":"INFO","client":"%(h)s","req":"%(r)s","status":%(s)s,"bytes":%(B)s,"referer":"%({Referer}i)s","ua":"%({User-Agent}i)s"}'
    environment:
      LOG_LEVEL: "INFO"
      ORCH_TOKEN: "yx4hMeToZ5AEsMywCZJYxxr5"
      FUSION_MODE: "weighted"
      FUSION_ALPHA: "0.2" # ml score weight
      FUSION_BETA: "0.8" # nlp score weight
      FUSION_LEVELS: "0.3,0.5,0.6,0.8"
      FUSION_TOPIC_STRONG: "0.7"
      FUSION_FINAL_THR: "0.55"
      FUSION_NOVELTY_AUX_ENABLED: "true"
      FUSION_NOVELTY_AUX_BUMP: "0.08"
      FUSION_NOVELTY_AUX_CAP: "0.15"
      FUSION_NOVELTY_AUX_USE_HIT: "true"
      FUSION_TOPIC_ESCALATION: "disabled" # "all_high" | "all_critical" | "list" | "disabled"
      HYST_ENABLED: "0"
      HYST_MARGIN: "0.07"
      HYST_UP_MARGIN: "0.02"
      HYST_KEY_FIELD: "hkey"
      HYST_TTL: "600" 
      REDIS_URL: "redis://redis:6379/0"
      FUSION_RISK_MODE: "score_x_impact"
      IMPACT_POLICY_FILE: "/app/policies/impact_policy.json"
    volumes:
      - ./policies/impact_policy.json:/app/policies/impact_policy.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 15s
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: ["redis-server","--save","", "--appendonly","no"]
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30m
      timeout: 5s
      start_period: 5m
      start_interval: 15s
      retries: 10
  alerting:
    build:
      context: .
      dockerfile: services/alerting/Dockerfile
    container_name: alerting
    restart: unless-stopped
    command:
      - gunicorn
      - main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "${GUNICORN_WORKERS:-2}"
      - -b
      - 0.0.0.0:8000
      - --timeout
      - "30"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --access-logformat
      - '{"ts":"%(t)s","level":"INFO","client":"%(h)s","req":"%(r)s","status":%(s)s,"bytes":%(B)s,"referer":"%({Referer}i)s","ua":"%({User-Agent}i)s"}'
    environment:
      LOG_LEVEL: "INFO"
      ORCH_TOKEN: "yx4hMeToZ5AEsMywCZJYxxr5"
      STIX_ENABLED: "0"
      ALERT_DRY_RUN: "0"
      OPENSEARCH_URL: "http://opensearch:9200"
      OPENSEARCH_USER: "admin"
      OPENSEARCH_PASS: "admin"
      OPENSEARCH_INDEX_PREFIX: "alerting"
      OPENSEARCH_VERIFY: "0"
      ALERT_MIN_RISK: "medium"
      ALERT_TIMEOUT: "3.0"
      ALERT_RETRIES: "3"
      REDIS_URL: "redis://redis:6379/0"
      ALERT_DEDUP_TTL: "3600"
      ALERT_DLQ_KEY: "alerting:dlq"
      ALERT_DLQ_REPLAY_BATCH: "200"
      ALERT_SINKS: "local, opensearch" # "slack,email,servicenow,local"
      SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/XXX/YYY/ZZZ" 
      OPENSEARCH_INCIDENT_INDEX_PREFIX: "incidents"
      EMAIL_SMTP_HOST: ""
      EMAIL_SMTP_PORT: "587"
      EMAIL_USER: ""
      EMAIL_PASS: ""
      EMAIL_TO: ""
      SERVICENOW_URL: ""
      SERVICENOW_USER: ""
      SERVICENOW_PASS: ""
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 15s
    depends_on:
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
  orchestrator:
    build: 
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: orchestrator
    restart: unless-stopped
    command:
      - gunicorn
      - main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "${GUNICORN_WORKERS:-2}"
      - -b
      - 0.0.0.0:8000
      - --timeout
      - "30"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --access-logformat
      - '{"ts":"%(t)s","level":"INFO","client":"%(h)s","req":"%(r)s","status":%(s)s,"bytes":%(B)s,"referer":"%({Referer}i)s","ua":"%({User-Agent}i)s"}'
    environment:
      URL_PRE: http://preprocess:8000/featurize
      URL_ML:  http://ml-inference:8000/score
      URL_NLP: http://nlp-inference:8000/score
      URL_FUS: http://fusion:8000/fuse
      URL_ALR: http://alerting:8000/alert
      ORCH_TOKEN: "yx4hMeToZ5AEsMywCZJYxxr5"
    ports:
      - "8000:8000"
    depends_on:
      preprocess:
        condition: service_healthy
      ml-inference:
        condition: service_healthy
      nlp-inference:
        condition: service_healthy
      fusion:
        condition: service_healthy
      alerting:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 15s
    volumes:
      - ./tests:/app/tests:ro
  ingestion:
    build: 
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: ingestion
    restart: unless-stopped
    command:
      - gunicorn
      - main:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "${GUNICORN_WORKERS:-2}"
      - -b
      - 0.0.0.0:8000
      - --timeout
      - "30"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --access-logformat
      - '{"ts":"%(t)s","level":"INFO","client":"%(h)s","req":"%(r)s","status":%(s)s,"bytes":%(B)s,"referer":"%({Referer}i)s","ua":"%({User-Agent}i)s"}'
    ports:
      - "8001:8000"
    environment:
      TOPIC_RAW: raw-events
      FORWARD_MODE: direct
      ORCHESTRATOR_URL: http://orchestrator:8000/process
      MAX_BODY_BYTES: "1048576"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 30m
      timeout: 5s
      retries: 3
      start_period: 5m
      start_interval: 15s
  opensearch:
    image: opensearchproject/opensearch:3.3.2
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"   # підлаштуй під свою RAM
      - plugins.security.disabled=true             # dev-режим без TLS/автентифікації
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=wGxJSsqR88vts26wFLnSLeEt
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 30m
      timeout: 5s
      retries: 10
      start_period: 5m
      start_interval: 15s
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.3.0
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
      interval: 30m
      timeout: 5s
      retries: 10
      start_period: 5m
      start_interval: 15s

volumes:
  opensearch-data:
